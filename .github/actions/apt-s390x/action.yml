name: apt
inputs:
  asan:
    default: false
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -x

        OPCACHE_TLS_TESTS_DEPS="gcc clang lld"

        export DEBIAN_FRONTEND=noninteractive

        # Install sudo in Docker for consistent actions
        if ! type "sudo" > /dev/null; then
          apt-get update -y | true
          apt-get install -y sudo
        fi

        sudo apt-get update -y | true
        sudo apt-get install -y \
          autoconf \
          gcc \
          make \
          curl \
          unzip \
          bison \
          re2c \
          locales \
          ldap-utils \
          openssl \
          slapd \
          language-pack-de \
          libgmp-dev \
          libicu-dev \
          libtidy-dev \
          libenchant-2-dev \
          libbz2-dev \
          libsasl2-dev \
          libxpm-dev \
          libzip-dev \
          libsqlite3-dev \
          libsqlite3-mod-spatialite \
          libwebp-dev \
          ${{ inputs.asan == 'false' && 'libavif-dev' || '' }} \
          libonig-dev \
          libcurl4-openssl-dev \
          libxml2-dev \
          libxslt1-dev \
          libpq-dev \
          libedit-dev \
          libldap2-dev \
          libsodium-dev \
          libargon2-dev \
          libmm-dev \
          libsnmp-dev \
          postgresql \
          postgresql-contrib \
          snmpd \
          snmp-mibs-downloader \
          llvm \
          clang \
          dovecot-core \
          dovecot-pop3d \
          dovecot-imapd \
          sendmail \
          liblmdb-dev \
          libtokyocabinet-dev \
          libdb-dev \
          libqdbm-dev \
          libjpeg-dev \
          libpng-dev \
          libfreetype6-dev \
          $OPCACHE_TLS_TESTS_DEPS

        # Install the GitHub CLI (gh) so setup-caddy-s390x can use it.
        # Self-hosted runners do not have gh pre-installed unlike GitHub-hosted runners.
        if ! type "gh" > /dev/null; then
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y | true
          sudo apt-get install -y gh
        fi
